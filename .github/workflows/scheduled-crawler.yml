name: 定時自動特惠爬蟲與 AI 解析入庫 (Daily Scheduled Crawler)

on:
  schedule:
    # GitHub Actions 使用 UTC 時間：
    # 00:30 UTC = 台灣時間 08:30 (🌅 早鳥通勤 / 早餐咖啡優惠)
    - cron: '30 0 * * *'
    # 04:00 UTC = 台灣時間 12:00 (🍱 午間外食 / 手搖飲買一送一)
    - cron: '0 4 * * *'
    # 10:00 UTC = 台灣時間 18:00 (🌆 下班採買 / 超市晚鳥促銷)
    - cron: '0 10 * * *'
    # 13:30 UTC = 台灣時間 21:30 (🌙 晚間爆文 / 次日早鳥搶先看)
    - cron: '30 13 * * *'

  # 支援在 GitHub 網頁介面上點擊「Run workflow」按鈕手動隨時觸發測試
  workflow_dispatch:

concurrency:
  group: scheduled-crawler
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    name: 執行四大黃金時段爬蟲與 Gemini 入庫
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Node.js 執行環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⚡ 方案一：快取 node_modules，避免每次重複 npm ci 下載數百套件
      - name: 檢查並還原 Node 模組快取 (Cache node_modules)
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 安裝專案依賴套件 (僅在快取未命中時執行)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      # ⚡ 方案一：快取 Playwright Chromium 瀏覽器核心 (約 180MB)
      - name: 檢查並還原 Playwright 瀏覽器快取 (Cache Playwright Chromium)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: 全新下載 Playwright 瀏覽器與系統依賴 (僅在快取未命中時執行)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 快速驗證 Playwright 系統底層相依函式庫 (快取命中時秒級完成)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 生成 Prisma 查詢引擎 (Prisma Generate)
        run: npx prisma generate

      - name: 執行定時爬蟲 + Gemini AI 解析 + 資料庫入庫
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/run-scheduled-crawl.mjs
